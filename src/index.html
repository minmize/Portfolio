<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sasha Guriev · World's Edge Mountains</title>
  <meta name="description" content="The portfolio of Sasha Guriev (@minmize), explored as a Total War: Warhammer III style campaign map of the World's Edge Mountains — from Karak Ungor through Karaz-a-Karak down to Karak Eight Peaks." />
  <meta name="author" content="Sasha Guriev" />
  <meta name="theme-color" content="#120d09" />
  <meta name="color-scheme" content="dark" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sasha Guriev — World's Edge Mountains" />
  <meta property="og:description" content="App Coding & Software and Algorithmic Trading & Finance, explored as a campaign map." />
  <meta property="og:image" content="og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sasha Guriev — World's Edge Mountains" />
  <meta name="twitter:image" content="og-image.svg" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='3,2 29,2 29,22 16,30 3,22' fill='%237a1c15' stroke='%23c9a45c' stroke-width='2.5'/%3E%3Cpath d='M10 11h12v3h-4.5v9h-3v-9H10z' fill='%23ecd29a'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Grenze+Gotisch:wght@500;600;700&family=Grenze:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body data-tier="strategic">
  <!-- Loading veil (removed once the terrain is built) -->
  <div class="veil" id="veil" aria-hidden="true">
    <div class="veil__inner">
      <svg class="veil__crest" width="44" height="50" viewBox="0 0 32 36" aria-hidden="true"><polygon points="2,2 30,2 30,24 16,34 2,24" fill="#5e1410" stroke="#c9a45c" stroke-width="2"/><path d="M9 10h14v3.4h-5.3V26h-3.4V13.4H9z" fill="#ecd29a"/></svg>
      <p class="veil__text">Charting the World's Edge…</p>
    </div>
  </div>

  <!-- 3D map -->
  <main id="map-stage" aria-label="Interactive 3D campaign map of the World's Edge Mountains">
    <canvas id="webgl-canvas"></canvas>
  </main>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Province lettering, settlement nameplates and landmark labels projected from 3D -->
  <div id="marker-layer"></div>

  <!-- =================== TOP HUD =================== -->
  <header class="hud-top">
    <div class="hud-top__left">
      <button class="book-btn" id="bookOpenBtn" type="button" aria-label="Open the Book of Works — read the whole portfolio as plain text">
        <span class="book-btn__medal" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2V4z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8V4z"/></svg>
        </span>
        <span class="book-btn__text">
          <span class="book-btn__title">Book of Works</span>
          <span class="book-btn__sub">Read everything plainly</span>
        </span>
      </button>
    </div>

    <div class="hud-top__center">
      <div class="plaque">
        <h1 class="plaque__name" id="plaqueName">Sasha Guriev</h1>
        <div class="plaque__rule" aria-hidden="true"><span></span></div>
        <p class="plaque__script" id="plaqueScript"></p>
      </div>
      <button class="return-pill" id="returnBtn" type="button" hidden>‹ Return to the World Map</button>
    </div>

    <div class="hud-top__right"></div>
  </header>

  <!-- =================== RIGHT RAIL (provinces + envoys) =================== -->
  <aside class="rail" aria-label="Provinces and contact">
    <div class="rail__crest" aria-hidden="true">
      <svg width="34" height="40" viewBox="0 0 32 36"><polygon points="2,2 30,2 30,24 16,34 2,24" fill="#5e1410" stroke="#c9a45c" stroke-width="1.6"/><path d="M9 10h14v3.4h-5.3V26h-3.4V13.4H9z" fill="#ecd29a"/></svg>
    </div>
    <div class="rail__group" id="railProvinces"></div>
    <div class="rail__sep" aria-hidden="true"></div>
    <div class="rail__group">
      <a class="rail-medal" id="railMail" href="mailto:" title="Send an envoy (email)" aria-label="Email Sasha">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="1.5"/><polyline points="3 7 12 13 21 7"/></svg>
      </a>
      <a class="rail-medal" id="railGithub" href="#" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub profile">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.08 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5z"/></svg>
      </a>
    </div>
    <div class="rail__line" aria-hidden="true"></div>
  </aside>

  <!-- =================== BOTTOM BAND (decorative status strip) =================== -->
  <footer class="band" aria-label="Campaign status">
    <div class="band__left">
      <span class="band__turn">Turn <b id="bandTurn">1</b></span>
      <span class="band__dot" aria-hidden="true"></span>
      <span class="band__season" id="bandSeason">Summer, 2526 IC</span>
      <span class="band__dot" aria-hidden="true"></span>
      <span class="band__loc" id="bandLocation">World's Edge Mountains</span>
    </div>
    <div class="band__orn" aria-hidden="true"></div>
    <div class="band__hint" id="bandHint">Drag to move · scroll to zoom · right-drag to turn</div>
  </footer>

  <!-- =================== TURN DIAL (zoom + end turn) =================== -->
  <div class="turn-dial">
    <div class="turn-dial__zoom">
      <button class="dial-mini" id="zoomInBtn" type="button" aria-label="Zoom in" title="Zoom in">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="dial-mini" id="zoomOutBtn" type="button" aria-label="Zoom out" title="Zoom out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg>
      </button>
    </div>
    <button class="turn-dial__end" id="endTurnBtn" type="button" title="End turn — travel to the next hold">
      <span class="turn-dial__plate">
        <span class="turn-dial__title">End Turn</span>
        <span class="turn-dial__next" id="endTurnNext">Next: Karaz-a-Karak</span>
      </span>
      <span class="turn-dial__medal" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h12M6 22h12"/><path d="M7 2c0 5 5 6 5 10s-5 5-5 10M17 2c0 5-5 6-5 10s5 5 5 10"/><path d="M9.5 19.5h5l-2.5-3z" fill="currentColor"/></svg>
        <span class="turn-dial__count" id="turnCount">1</span>
      </span>
    </button>
  </div>

  <!-- Hover tooltip -->
  <div class="tw-tooltip" id="twTooltip" role="tooltip" aria-hidden="true"></div>

  <!-- =================== SETTLEMENT: building info (left) =================== -->
  <aside class="building-info" id="buildingInfo" aria-live="polite" aria-label="Selected construction details"></aside>

  <!-- =================== SETTLEMENT: construction bar (bottom) =================== -->
  <section class="settlement-bar" id="settlementBar" aria-label="Settlement construction options">
    <div class="sb-head">
      <div class="sb-province" id="sbProvince"></div>
      <div class="sb-tabs" id="sbTabs" role="tablist" aria-label="Holds in this province"></div>
    </div>
    <div class="sb-body">
      <div class="sb-city" id="sbCity"></div>
      <div class="sb-slots" id="sbSlots" role="tablist" aria-label="Construction options"></div>
    </div>
  </section>

  <!-- =================== BOOK OF WORKS (plain reader) =================== -->
  <div class="book" id="book" role="dialog" aria-modal="true" aria-labelledby="bookTitle" aria-hidden="true">
    <div class="book__frame">
      <nav class="book__toc" id="bookToc" aria-label="Book contents"></nav>
      <article class="book__page" id="bookPage" tabindex="-1"></article>
      <button class="book__close" id="bookCloseBtn" type="button">Close ✕</button>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
